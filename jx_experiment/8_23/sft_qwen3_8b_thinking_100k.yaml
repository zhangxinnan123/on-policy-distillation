### model
model_name_or_path: Qwen/Qwen3-8B-Base

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json
enable_liger_kernel: true
packing: true
neat_packing: true
flash_attn: fa2

### dataset
dataset: opd_sft_100k
template: qwen3
cutoff_len: 20000
overwrite_cache: false
preprocessing_num_workers: 16
tokenized_path: /fsx/xinnanzh/.tokenized/opd_sft_100k_qwen3_20k
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_num_workers: 4

### output
output_dir: /fsx/xinnanzh/checkpoints/sft_qwen3_8b_thinking_100k
logging_steps: 5
save_steps: 200
save_total_limit: 3
plot_loss: true
report_to: wandb
run_name: sft_qwen3_8b_thinking_100k

### train
# effective bs = per_device × grad_accum × world_size = 1 × 2 × 64 = 128
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### model
model_name_or_path: Qwen/Qwen3-8B-Base

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json
enable_liger_kernel: true
packing: true
neat_packing: true
flash_attn: fa2

### dataset
# 100k prompts, n=8 candidates per prompt (same data as the 1-epoch run).
# Reuses the existing tokenized cache — no re-tokenization.
dataset: opd_sft_100k
template: qwen3
cutoff_len: 20000
overwrite_cache: false
preprocessing_num_workers: 16
tokenized_path: /fsx/xinnanzh/.tokenized/opd_sft_100k_qwen3_20k
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_num_workers: 4

### output
# Separate dir so the existing 1-epoch checkpoint stays intact.
output_dir: /fsx/xinnanzh/checkpoints/sft_qwen3_8b_thinking_100k_2ep
logging_steps: 5
# Save at each epoch boundary so ep1 and ep2 are both available for comparison.
save_strategy: epoch
save_total_limit: 3
plot_loss: true
report_to: wandb
run_name: sft_qwen3_8b_thinking_100k_2ep

### train
# effective bs = per_device × grad_accum × world_size = 1 × 2 × 64 = 128
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
